# Static deployment manifest for Databricks Apps — this file is not processed through
# databricks.yml's ${var.x} substitution, so values here must be literals. Must be kept
# in sync with MODEL_SERVING_ENDPOINT_NAME in .env (default: salesduo-agent, per the
# naming convention in section 6). If you change that value in .env, update it here too.
command: ["streamlit", "run", "app.py"]
env:
  - name: MODEL_SERVING_ENDPOINT_NAME
    value: "salesduo-agent"
