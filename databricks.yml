# Databricks Asset Bundle config: the only deployment artifact managed here is the
# Databricks App (the chat UI). Provisioning/deployment of the UC Function / Genie
# Space / Delta table / Vector Search Index / Model Serving Endpoint goes through the
# SDK scripts under ops/ (one-off provisioning actions that don't fit a declarative
# bundle `resources` block — most of them need to read/parse results and generate
# content dynamically, not just apply static config).
#
# Note: this file was written without the Databricks CLI installed locally, and has
# not yet been run through `databricks bundle validate`. Run validate once you have the
# CLI and real credentials, before deploying.
bundle:
  name: salesduo

variables:
  databricks_app_name:
    description: Databricks App name
    default: salesduo-agent
  model_serving_endpoint_name:
    description: Name of the Model Serving Endpoint hosting the ResponsesAgent
    default: salesduo-agent

resources:
  apps:
    salesduo_agent:
      name: ${var.databricks_app_name}
      description: "SalesDuo AdventureWorks structured+unstructured data Q&A chat app"
      source_code_path: ./app
      resources:
        - name: model-serving-endpoint
          serving_endpoint:
            name: ${var.model_serving_endpoint_name}
            permission: CAN_QUERY

targets:
  dev:
    default: true
    mode: development
